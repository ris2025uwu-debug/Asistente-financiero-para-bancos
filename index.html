<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B6E4F">
  <meta name="description" content="Asistente financiero – Propuesta académica con datos simulados">
  <title>Asistente Financiero · Propuesta Académica</title>

  <!-- Tipografía Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ═══ Shell de la aplicación ═══ -->
  <div class="app-shell">

    <!-- ── Header ── -->
    <header class="app-header">
      <h1 class="app-header__title">Asistente financiero</h1>
      <p class="app-header__subtitle">Propuesta académica · Datos simulados</p>
    </header>

    <!-- ── Contenido principal ── -->
    <main class="app-content">
      <div id="view-resumen" class="view active"></div>
      <div id="view-pagos" class="view"></div>
      <div id="view-proyeccion" class="view"></div>
      <div id="view-ayuda" class="view"></div>
    </main>

    <!-- ── Navegación inferior ── -->
    <nav class="bottom-nav" aria-label="Navegación principal">
      <button class="nav-item active" data-tab="resumen" aria-label="Resumen">
        <span class="nav-item__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </span>
        <span class="nav-item__label">Resumen</span>
      </button>
      <button class="nav-item" data-tab="pagos" aria-label="Pagos">
        <span class="nav-item__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        </span>
        <span class="nav-item__label">Pagos</span>
      </button>
      <button class="nav-item" data-tab="proyeccion" aria-label="Proyección">
        <span class="nav-item__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </span>
        <span class="nav-item__label">Proyección</span>
      </button>
      <button class="nav-item" data-tab="ayuda" aria-label="Ayuda / IA">
        <span class="nav-item__icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/></svg>
        </span>
        <span class="nav-item__label">Ayuda / IA</span>
      </button>
    </nav>

  </div><!-- /.app-shell -->


  <!-- ═══════════════════════════════════════════════════════
       MODAL 1 — Simulación rápida (Resumen)
       ═══════════════════════════════════════════════════════ -->
  <div id="simModal" class="modal-backdrop" onclick="if(event.target===this) App.closeSimModal()">
    <div class="modal-sheet">
      <div class="modal-sheet__handle"></div>
      <h2 class="modal-sheet__title">Simular un movimiento</h2>
      <p class="modal-sheet__subtitle">Agrega un gasto o ingreso hipotético para ver cómo impacta tu proyección.</p>

      <div class="form-group">
        <label class="form-label" for="simType">Tipo de movimiento</label>
        <select id="simType" class="form-select">
          <option value="expense">Gasto / Egreso</option>
          <option value="income">Ingreso</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="simConcept">Concepto</label>
        <input type="text" id="simConcept" class="form-input" placeholder="Ej: Compra online, regalo…">
      </div>
      <div class="form-group">
        <label class="form-label" for="simAmount">Monto (S/)</label>
        <input type="number" id="simAmount" class="form-input" placeholder="0.00" min="0.01" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label" for="simDay">Día del movimiento (1-30)</label>
        <input type="number" id="simDay" class="form-input" value="15" min="1" max="30">
      </div>

      <div class="sim-result"></div>

      <div class="btn-group" style="margin-top:var(--space-xl);">
        <button class="btn btn--outline" onclick="App.previewSimulation()">Vista previa</button>
        <button class="btn btn--primary" onclick="App.confirmSimulation()">Confirmar</button>
      </div>
      <button class="modal-cancel" onclick="App.closeSimModal()">Cancelar</button>
    </div>
  </div>


  <!-- ═══════════════════════════════════════════════════════
       MODAL 2 — CRUD de compromisos (Pagos)
       ═══════════════════════════════════════════════════════ -->
  <div id="crudModal" class="modal-backdrop" onclick="if(event.target===this) App.closeCrudModal()">
    <div class="modal-sheet">
      <div class="modal-sheet__handle"></div>
      <h2 class="modal-sheet__title" id="crudModalTitle">Registrar compromiso</h2>
      <p class="modal-sheet__subtitle">Ingresa los datos del movimiento. Todos los campos son obligatorios.</p>

      <!-- Tipo -->
      <div class="form-group">
        <label class="form-label" for="crudType">Tipo de movimiento</label>
        <select id="crudType" class="form-select">
          <option value="registered">Pago registrado</option>
          <option value="estimated">Gasto estimado (ML)</option>
          <option value="pending">Ingreso esperado</option>
        </select>
      </div>

      <!-- Concepto -->
      <div class="form-group">
        <label class="form-label" for="crudConcept">Concepto</label>
        <input type="text" id="crudConcept" class="form-input" placeholder="Ej: Alquiler, préstamo, sueldo…" maxlength="60">
        <div id="crudConceptError" class="form-error"></div>
      </div>

      <!-- Monto -->
      <div class="form-group">
        <label class="form-label" for="crudAmount">Monto (S/)</label>
        <input type="number" id="crudAmount" class="form-input" placeholder="0.00" min="0.01" step="0.01">
        <div id="crudAmountError" class="form-error"></div>
      </div>

      <!-- Día -->
      <div class="form-group">
        <label class="form-label" for="crudDay">Día del movimiento (1 – 30)</label>
        <input type="number" id="crudDay" class="form-input" placeholder="Ej: 15" min="1" max="30" step="1">
        <div id="crudDayError" class="form-error"></div>
      </div>

      <!-- Botones -->
      <div class="btn-group" style="margin-top:var(--space-xl);">
        <button class="btn btn--outline" onclick="App.closeCrudModal()">Cancelar</button>
        <button class="btn btn--primary" id="crudBtnSave" onclick="App.saveCrud()">Registrar</button>
      </div>
    </div>
  </div>


  <!-- ═══ Toast ═══ -->
  <div id="toast" class="toast"></div>


  <!-- JavaScript -->
  <script src="js/app.js"></script>

</body>
</html>
